name: Release GitHub Package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: heyq02/workflows/.github/workflows/release-gh-pkg.yml@main
    permissions:
      id-token: write
      contents: write
      packages: write
    with:
      github-package-publish: true
      github-package-scope: '@heyq02'
